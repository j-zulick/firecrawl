# Fork CI (j-zulick/firecrawl): fast checks for the fork's own changes.
# Upstream's full test-server suite needs upstream secrets and infrastructure,
# so it is not what gates this fork. This workflow is restricted to the fork.
name: Fork CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-config:
    name: Compose config + ops scripts
    if: github.repository == 'j-zulick/firecrawl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compose file is valid with required variables set
        run: REDIS_URL=redis://redis:6379 POSTGRES_PASSWORD=ci docker compose config -q
      - name: Compose refuses to start without required secrets
        run: |
          if docker compose config -q 2>/dev/null; then
            echo "compose config should fail without REDIS_URL/POSTGRES_PASSWORD"; exit 1
          fi
      - name: Shell scripts
        run: |
          bash -n ops/selfhost-smoke.sh
          shellcheck ops/selfhost-smoke.sh

  playwright-service:
    name: playwright-service build + tests
    if: github.repository == 'j-zulick/firecrawl'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playwright-service-ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  api:
    name: API typecheck + knip
    if: github.repository == 'j-zulick/firecrawl'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      # Same order as upstream's test-api-core: install without lifecycle
      # scripts (foundationdb's install script needs the FDB C client, which
      # the type check does not), then build the Rust module with napi.
      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          npm_config_ignore_scripts: 'true'
      - name: Build native (Rust) module
        working-directory: apps/api/native
        run: ./node_modules/.bin/napi build --platform --release
      - run: npx tsc --noEmit -p .
      - run: pnpm knip
