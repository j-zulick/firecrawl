name: Verify isolated Firecrawl stack
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/verify-selfhost-smoke.yml'
permissions:
  contents: read
jobs:
  local-smoke:
    if: github.repository == 'j-zulick/firecrawl'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fork-smoke
      COMPOSE_PROFILES: bundled-redis
      COMPOSE_PARALLEL_LIMIT: 1
      REDIS_URL: redis://redis:6379
      POSTGRES_PASSWORD: disposable-ci-only
      SMOKE_TIMEOUT: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the sandbox and build the fork revision
        run: |
          df -h /
          docker compose config --quiet
          docker compose build nuq-postgres playwright-service api
      - name: Start local services and test both API versions
        run: |
          docker compose up --no-build --wait --wait-timeout 180
          bash ops/selfhost-smoke.sh http://127.0.0.1:3002
      - name: Record the final sandbox state
        if: always()
        run: |
          docker compose ps -a
          df -h /
          docker system df
          docker compose down --volumes --remove-orphans
